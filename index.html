<h1>God</h1>
<p>God is a personal desktop app. One person, its owner, uses it on their own computers to see their Google Calendar and Google Tasks alongside their notes, and to add events and tasks to them.</p>
<p>It is not offered to anyone else, and there is no sign-up.</p>
